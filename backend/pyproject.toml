# Tool configuration only. Install with: pip install -r requirements-dev.txt
[project]
name = "risk-api"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_dev_fixture.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic", "tests"]

[[tool.mypy.overrides]]
module = ["shapely.*", "sklearn.*", "joblib.*", "pandas.*"]
ignore_missing_imports = true
