name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { API_URL: http://localhost:8000 }

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/e2e.db
      MODELS_DIR: /tmp/e2e_models
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements-dev.txt playwright && playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Migrate and seed (synthetic dev data)
        working-directory: backend
        run: alembic upgrade head && python -m scripts.load_geographies && python -m scripts.seed_dev
      - name: Start API and web, then run the browser walkthrough
        run: |
          (cd backend && uvicorn app.main:create_app --factory --port 8000 &) 
          (cd frontend && npm start &)
          for i in $(seq 1 40); do curl -sf localhost:8000/readyz && curl -sf -o /dev/null localhost:3000 && break; sleep 2; done
          python scripts/e2e_smoke.py

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend
      - run: docker build ./frontend
